# yamllint disable-file
name: "nix"
on:
  workflow_dispatch: # allows manual triggering
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  # 1. Gate job to check if this commit/content was already built
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: true
  # 2. Flake check job
  check:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    name: "nix flake check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          diagnostic-endpoint: ""
      - uses: cachix/cachix-action@v17
        with:
          name: mettavi
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: "Check flake health"
        run: nix flake check
  # 3. Host build matrix job
  build:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    name: "build (${{ matrix.host }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Replace these with your actual NixOS hostname attributes from flake.nix
        host: [oona, remus, blue]
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          diagnostic-endpoint: ""
      - uses: cachix/cachix-action@v17
        with:
          name: mettavi
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: "Build NixOS System"
        env:
          SKIP_CALIBRE_TESTS: "1"
        run: |
          nix build --no-update-lock-file .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
