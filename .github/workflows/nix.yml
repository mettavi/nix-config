# yamllint disable-file
name: "nix"
on:
  workflow_dispatch: # allows manual triggering
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  check:
    name: "nix flake check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v8
        with:
          diagnostic-endpoint: ""
      - uses: cachix/cachix-action@v17
        with:
          name: mettavi
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: "Check flake health"
        run: nix flake check
  build:
    name: "build (${{ matrix.host }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Replace these with your actual NixOS hostname attributes from flake.nix
        host: [oona, remus, blue]
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          diagnostic-endpoint: ""
      - uses: cachix/cachix-action@v17
        with:
          name: mettavi
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: "Build NixOS System"
        run: |
          nix build --no-update-lock-file .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
