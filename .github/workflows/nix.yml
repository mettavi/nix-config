# yamllint disable-file
name: "nix"
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  check:
    name: "nix flake check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH Auth to Private Repo
        uses: ./composite/ssh-repo.yml
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v8
        with:
          diagnostic-endpoint: ""
      - uses: cachix/cachix-action@v17
        with:
          name: mettavi
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: "Check flake health"
        run: nix flake check -Lvv
  build:
    name: "build (${{ matrix.host }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Replace these with your actual NixOS hostname attributes from flake.nix
        host: [oona, remus, blue]
    steps:
      - uses: actions/checkout@v4
      - name: SSH Auth to Private Repo
        uses: ./composite/ssh-repo.yml
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v8
        with:
          diagnostic-endpoint: ""
      - uses: cachix/cachix-action@v15
        with:
          name: mettavi
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: "Build NixOS System"
        run: |
          nix build -Lvvv --no-update-lock-file --show-trace .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
